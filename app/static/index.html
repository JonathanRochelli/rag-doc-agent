<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>RAG Agent — NovaTrack Docs</title>
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body>
        <header>
            <div class="brand">
                <span class="dot"></span>
                <div>
                    RAG Agent — Demo
                    <small>NovaTrack internal documentation (fictional)</small>
                </div>
            </div>
            <span class="badge">Claude API</span>
        </header>

        <main>
            <div id="messages">
                <div class="empty-state" id="empty-state">
                    <h2>Ask a question about the NovaTrack documentation</h2>
                    <p>This agent answers only from the indexed documents (product guide, FAQ, refund policy) and cites its sources.</p>
                    <div class="examples">
                        <button type="button" data-q="What plans are available and how much do they cost?">What plans are available and how much do they cost?</button>
                        <button type="button" data-q="How do I request a refund?">How do I request a refund?</button>
                        <button type="button" data-q="What's the maximum size for an attachment?">What's the maximum size for an attachment?</button>
                    </div>
                </div>
            </div>

            <form id="chat-form">
                <input type="text" id="question" placeholder="Ask your question..." autocomplete="off" />
                <button type="submit" aria-label="Send">➤</button>
            </form>
        </main>

        <footer>
            Technical demo — <a href="https://github.com/JonathanRochelli" target="_blank" rel="noopener">JonathanRochelli</a>
        </footer>

        <script src="/static/app.js"></script>
    </body>
</html>
